<!doctype html>
<html lang="ko" data-theme="light" data-gradient="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ScoreLab · 내신 점수 계산기</title>
    <meta
      name="description"
      content="지필·수행 반영 비율을 넣으면 지금 점수와 목표까지 필요한 점수를 오차 없이 계산합니다. 구글 로그인으로 기기 간 동기화, 오프라인 설치 지원."
    />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="color-scheme" content="light dark" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ScoreLab" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ScoreLab · 내신 점수 계산기" />
    <meta property="og:description" content="목표 점수까지 몇 점이 필요한지 오차 없이 계산합니다." />

    <!--
      저장된 테마를 첫 페인트 전에 적용한다. 이게 없으면 어두운 테마 사용자가
      흰 화면을 한 프레임 보게 된다. (키는 src/lib/storage.ts 의 KEYS.settings)
    -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('scorelab.settings.v1') || '{}');
          var mode = saved.theme || 'system';
          var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          root.dataset.gradient = saved.gradient === false ? 'off' : 'on';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? '#0a0c13' : '#f6f7fb';
        } catch (error) {
          /* 저장소가 막혀 있으면 기본값 그대로 간다 */
        }
      })();
    </script>

    <style>
      /* 번들이 붙기 전까지 보여 줄 최소한의 자리. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f6f7fb;
      }
      :root[data-theme='dark'] #boot {
        background: #0a0c13;
      }
      #boot span {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid rgba(99, 102, 241, 0.25);
        border-top-color: #6366f1;
        animation: boot-spin 800ms linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><span></span></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        이 계산기는 자바스크립트로 동작합니다. 브라우저 설정에서 자바스크립트를 켜 주세요.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 앱이 그려지면 자리표시자를 치운다.
      window.addEventListener('load', function () {
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
      });
    </script>
  </body>
</html>
